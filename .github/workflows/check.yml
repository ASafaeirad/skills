name: Check skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.6
      - name: Validate skills
        run: deno task check
